name: idr-db-importer-backfill
run-name: "idr-db-importer backfill for contracts: ${{ inputs.contracts }} and month: ${{ inputs.month }}"

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to restore, yyyy-MM. Must be older than the current month minus 2"
        type: string
        required: true
      contracts:
        description: "Comma separated contract numbers, e.g. S4802,S5601"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: idr-db-importer-backfill-prod
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: codebuild-ab2d-prod-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 360

    env:
      MONTH: ${{ inputs.month }}
      CONTRACTS: ${{ inputs.contracts }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: arn:aws:iam::${{ secrets.PROD_ACCOUNT }}:role/delegatedadmin/developer/ab2d-prod-github-actions
      AWS_ROLE_SESSION_NAME: gha-backfill-${{ github.run_id }}

    steps:
      - name: Run the backfill
        shell: bash
        run: |
          # Role sessions last 1 hour and backfills run longer. 
          # When AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE are set, each AWS command assumes the role automatically.
          # This wrapper needs to create a fresh GitHub OIDC token.
          export AWS_WEB_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/oidc-token"
          aws() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -er '.value' > "$AWS_WEB_IDENTITY_TOKEN_FILE"
            command aws "$@"
          }

          CLUSTER="ab2d-prod"
          SERVICE=$(aws ecs describe-services --cluster "$CLUSTER" \
            --services "ab2d-prod-idr-db-importer" --query 'services[0]' --output json)
          TASK_DEF=$(jq -r '.taskDefinition' <<<"$SERVICE")
          NETWORK=$(jq -c '.networkConfiguration' <<<"$SERVICE")
          OVERRIDES=$(jq -nc --arg m "$MONTH" --arg k "$CONTRACTS" \
            '{containerOverrides: [{name: "idr-db-importer", environment: [
              {name: "BACKFILL_MONTH", value: $m}, {name: "BACKFILL_CONTRACTS", value: $k}]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --started-by "gha-backfill-${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::ecs run-task did not start a task"
            exit 1
          fi
          echo "Started $TASK_ARN ($TASK_DEF) for $MONTH: $CONTRACTS"

          while true; do
            STATUS=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' --output text)
            echo "$(date -u +%H:%M:%S) $STATUS"
            [ "$STATUS" = "STOPPED" ] && break
            sleep 60
          done

          RESULT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --output json)
          EXIT_CODE=$(jq -r '.tasks[0].containers[] | select(.name == "idr-db-importer") | .exitCode' <<<"$RESULT")
          echo "Stopped reason: $(jq -r '.tasks[0].stoppedReason' <<<"$RESULT")"
          echo "Exit code: $EXIT_CODE"

          {
            echo "### Backfill $MONTH"
            echo "Contracts: \`$CONTRACTS\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Backfill task exited with $EXIT_CODE. See log stream ab2d-prod/idr-db-importer/${TASK_ARN##*/} in /aws/ecs/fargate/ab2d-prod/idr-db-importer."
            exit 1
          fi
