name: code-checks (snyk code scheduled)

on:
  workflow_dispatch:
  workflow:call:

permissions:
  id-token: write
  contents: read

jobs:
  scheduled-code-checks:
    name: 'Scheduled Code Checks for AB2D'
    uses: CMSGov/CDAP/.github/workflows/snyk-monitor.yml@ab2d-snyk-testing
    with:
      app: ab2d
      ref: main
      cli_args: "--all-projects --exclude=e2e-bfd-test,e2e-test,fhir-test,common,coverage,job,libs,ops,local-dev,scripts"
    secrets:
      PROD_ACCOUNT: ${{ secrets.PROD_ACCOUNT }}
